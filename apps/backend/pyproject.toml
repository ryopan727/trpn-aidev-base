[project]
name = "aidev-tasks-api"
version = "0.1.0"
requires-python = ">=3.15,<3.16"
dependencies = [
  "fastapi==0.162.1",
  "pydantic==2.14.3",
  "psycopg[binary]==3.3.9",
  "psycopg-pool==3.3.3",
  "uvicorn==0.54.0",
  "starlette==1.10.0",
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "httpx==0.28.1",
  "ruff==0.17.5",
  "mypy==2.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["db: requires the isolated PostgreSQL test database"]
addopts = "-ra"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
files = ["app"]
check_untyped_defs = true
